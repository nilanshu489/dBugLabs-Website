<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362203"/>
      <stop offset="50%" stop-color="#1c1101"/>
      <stop offset="100%" stop-color="#0a0600"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fb8500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glow)"/>

  <!-- Broadcast Waves -->
  <path d="M 230 150 A 60 60 0 0 1 230 250" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 260 130 A 100 100 0 0 1 260 270" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M 290 110 A 140 140 0 0 1 290 290" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

  <!-- Megaphone Icon -->
  <g filter="url(#neonBlur)">
    <!-- Megaphone Cone -->
    <polygon points="120,170 190,130 190,270 120,230" fill="#291600" stroke="url(#primaryGrad)" stroke-width="5"/>
    <rect x="90" y="170" width="30" height="60" rx="6" fill="url(#primaryGrad)"/>
    
    <!-- Megaphone Ring -->
    <ellipse cx="190" cy="200" rx="10" ry="70" fill="url(#primaryGrad)"/>

    <!-- Megaphone Handle -->
    <path d="M 140 230 L 125 280 C 122 290 135 295 142 285 L 160 230 Z" fill="url(#primaryGrad)"/>
  </g>

  <!-- Cosmic Stars -->
  <polygon points="190,65 194,77 206,81 194,85 190,97 186,85 174,81 186,77" fill="#ffb703"/>
  <polygon points="80,110 83,118 91,120 83,122 80,130 77,122 69,120 77,118" fill="#fb8500"/>
</svg>
