<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="50%" stop-color="#041a14"/>
      <stop offset="100%" stop-color="#010c09"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00bbf9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glow)"/>

  <!-- Network Connection Lines -->
  <g stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="8 6">
    <line x1="200" y1="130" x2="110" y2="230"/>
    <line x1="200" y1="130" x2="290" y2="230"/>
    <line x1="110" y1="230" x2="290" y2="230"/>
    <line x1="200" y1="130" x2="200" y2="280"/>
  </g>

  <!-- Central & Surrounding Nodes -->
  <g filter="url(#neonBlur)">
    <!-- Top Node -->
    <circle cx="200" cy="130" r="32" fill="#042019" stroke="url(#primaryGrad)" stroke-width="4"/>
    <circle cx="200" cy="130" r="16" fill="#00f5d4"/>

    <!-- Left Node -->
    <circle cx="110" cy="230" r="28" fill="#042019" stroke="url(#primaryGrad)" stroke-width="4"/>
    <circle cx="110" cy="230" r="14" fill="#00bbf9"/>

    <!-- Right Node -->
    <circle cx="290" cy="230" r="28" fill="#042019" stroke="url(#primaryGrad)" stroke-width="4"/>
    <circle cx="290" cy="230" r="14" fill="#00bbf9"/>

    <!-- Bottom Node -->
    <circle cx="200" cy="280" r="24" fill="#042019" stroke="url(#primaryGrad)" stroke-width="4"/>
    <circle cx="200" cy="280" r="12" fill="#3b82f6"/>
  </g>

  <!-- Sparkles -->
  <polygon points="200,60 204,72 216,76 204,80 200,92 196,80 184,76 196,72" fill="#00f5d4"/>
  <polygon points="330,140 333,148 341,150 333,152 330,160 327,152 319,150 327,148" fill="#00bbf9"/>
  <polygon points="70,140 73,148 81,150 73,152 70,160 67,152 59,150 67,148" fill="#3b82f6"/>
</svg>
