<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#0a0216"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b91"/>
      <stop offset="50%" stop-color="#c738d8"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff76ce"/>
      <stop offset="100%" stop-color="#9400d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e056fd" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#8c7ae6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glow)"/>

  <!-- Stage Lights & Rays -->
  <path d="M 80 40 L 160 220 L 120 220 Z" fill="#ff4b91" opacity="0.15" />
  <path d="M 320 40 L 240 220 L 280 220 Z" fill="#9400d3" opacity="0.15" />

  <!-- Calendar Outer Card -->
  <g filter="url(#neonBlur)">
    <rect x="90" y="110" width="220" height="190" rx="24" fill="#1b0833" stroke="url(#primaryGrad)" stroke-width="4"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 90 134 C 90 120 100 110 114 110 L 286 110 C 300 110 310 120 310 134 L 310 160 L 90 160 Z" fill="url(#primaryGrad)"/>

    <!-- Calendar Rings -->
    <rect x="140" y="90" width="16" height="32" rx="8" fill="#ffffff"/>
    <rect x="244" y="90" width="16" height="32" rx="8" fill="#ffffff"/>

    <!-- Calendar Grid Items -->
    <circle cx="140" cy="200" r="12" fill="#ff76ce"/>
    <circle cx="200" cy="200" r="12" fill="url(#accentGrad)"/>
    <circle cx="260" cy="200" r="12" fill="#7b2cbf"/>

    <circle cx="140" cy="250" r="12" fill="#7b2cbf"/>
    <rect x="184" y="240" width="92" height="20" rx="10" fill="url(#primaryGrad)"/>
  </g>

  <!-- Cosmic Sparkles -->
  <polygon points="200,50 205,65 220,70 205,75 200,90 195,75 180,70 195,65" fill="#ffd166"/>
  <polygon points="320,180 323,190 333,193 323,196 320,206 317,196 307,193 317,190" fill="#ff76ce"/>
  <polygon points="70,240 73,248 81,250 73,252 70,260 67,252 59,250 67,248" fill="#9400d3"/>
</svg>
